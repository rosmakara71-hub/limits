<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ការប្រឡងវាស់ស្ទង់សមត្ថភាព៖ លីមីតនៃអនុគមន៍</title>
    
    <!-- កំណត់ Configuration ឱ្យ MathJax ស្គាល់សញ្ញា $...$ -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Khmer OS Battambang', 'Segoe UI', Tahoma, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
            position: relative;
        }
        
        /* រចនាប័ទ្មសម្រាប់ Watermark */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 5vw; /* ទំហំអក្សរប្រែប្រួលតាមទំហំអេក្រង់ */
            color: #000;
            opacity: 0.08; /* ភាពព្រាលនៃអក្សរ (0.08 គឺព្រាលខ្លាំងកុំឱ្យរំខានភ្នែក) */
            z-index: 9999; /* ឱ្យអណ្តែតពីលើគេ */
            pointer-events: none; /* មិនរារាំងការចុចរបស់សិស្ស */
            white-space: nowrap;
            user-select: none; /* មិនអនុញ្ញាតឱ្យសិស្ស highlight កូពីបាន */
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }
        h2, h3 {
            text-align: center;
            color: #1a73e8;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: center;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            font-family: inherit;
            width: 80%;
            max-width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #1a73e8;
            color: #fff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        
        /* Exam Screen */
        #exam-screen, #result-screen {
            display: none;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            background: #e8f0fe;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #1a73e8;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .question-card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .question-text {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .options-list {
            list-style: none;
            padding: 0;
        }
        .options-list li {
            margin-bottom: 10px;
        }
        .options-list label {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .options-list label:hover {
            background: #f1f3f4;
        }
        .options-list input {
            margin-right: 15px;
            transform: scale(1.2);
        }
        
        /* Result Screen */
        .result-summary {
            text-align: center;
            padding: 20px;
            background: #e8f0fe;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .score-display {
            font-size: 32px;
            font-weight: bold;
            color: #1a73e8;
            margin: 10px 0;
        }
        .grade-display {
            font-size: 24px;
            font-weight: bold;
            color: #d93025;
        }
        .review-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .correct-bg { border-left: 5px solid #34a853; }
        .wrong-bg { border-left: 5px solid #ea4335; }
        .unanswered-bg { border-left: 5px solid #fbbc04; }
        
        .ans-row { margin-top: 10px; font-size: 15px; }
        .solution-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border: 1px dashed #ccc;
            border-radius: 5px;
        }
        .motivational-msg {
            font-size: 18px;
            font-weight: bold;
            color: #188038;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<!-- Watermark អណ្តែតកណ្តាលទំព័រ -->
<div class="watermark">រៀបចំដោយលោកគ្រូ រស់ មករា</div>

<div class="container" id="start-screen">
    <h2>ប្រឡងវាស់ស្ទង់សមត្ថភាពគណិតវិទ្យា</h2>
    <h3 style="color: #555;">ប្រធានបទ៖ ការគណនាលីមីតនៃអនុគមន៍</h3>
    <p style="text-align: center; color: #666;">
        ចំនួនលំហាត់៖ ២៥ គ្រាប់ | ពិន្ទុសរុប៖ ១២៥ ពិន្ទុ
    </p>
    <div class="input-group">
        <input type="text" id="student-name" placeholder="សូមបញ្ចូលឈ្មោះរបស់អ្នកនៅទីនេះ..." required>
    </div>
    <div class="input-group">
        <button onclick="startExam()">ចាប់ផ្តើមប្រឡង 🚀</button>
    </div>
</div>

<div class="container" id="exam-screen">
    <div class="header-info">
        <div>បេក្ខជន៖ <span id="display-name"></span></div>
        <div>ម៉ោង៖ <span id="timer">00:00</span></div>
    </div>
    
    <div id="questions-container">
        <!-- សំណួរនឹងត្រូវបានបង្ហាញនៅទីនេះដោយ JavaScript -->
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
        <button onclick="submitExam()">បញ្ចប់ការប្រឡង ✔️</button>
    </div>
</div>

<div class="container" id="result-screen">
    <div class="result-summary">
        <h2>លទ្ធផលនៃការប្រឡង</h2>
        <div style="font-size: 18px;">ឈ្មោះ៖ <strong id="res-name"></strong> | រយៈពេល៖ <strong id="res-time"></strong></div>
        <div class="score-display">ពិន្ទុរបស់អ្នក៖ <span id="res-score"></span> / 125</div>
        <div class="grade-display">និទ្ទេស៖ <span id="res-grade"></span></div>
        <div class="motivational-msg" id="res-msg"></div>
    </div>
    
    <h3>លម្អិតលំហាត់ និងដំណោះស្រាយ</h3>
    <div id="review-container">
        <!-- ដំណោះស្រាយនឹងត្រូវបានបង្ហាញនៅទីនេះ -->
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
        <button onclick="location.reload()">ត្រឡប់ទៅដើមវិញ 🔄</button>
    </div>
</div>

<script>
    // ទិន្នន័យលំហាត់ទាំង ២៥
    const rawQuestions = [
        { eq: "\\lim_{x \\to 2} (x^2 + 3x - 1)", ans: "9", options: ["9", "5", "7", "11"], sol: "2^2 + 3(2) - 1 = 4 + 6 - 1 = 9" },
        { eq: "\\lim_{x \\to -1} (2x^3 - x + 4)", ans: "3", options: ["3", "1", "5", "-1"], sol: "2(-1)^3 - (-1) + 4 = -2 + 1 + 4 = 3" },
        { eq: "\\lim_{x \\to 0} (4x^2 - 5x + 7)", ans: "7", options: ["7", "0", "-5", "4"], sol: "4(0)^2 - 5(0) + 7 = 0 - 0 + 7 = 7" },
        { eq: "\\lim_{x \\to 3} (x^2 - 4x + 3)", ans: "0", options: ["0", "3", "-3", "6"], sol: "3^2 - 4(3) + 3 = 9 - 12 + 3 = 0" },
        { eq: "\\lim_{x \\to -2} (x^2 + 5x + 6)", ans: "0", options: ["0", "2", "-2", "4"], sol: "(-2)^2 + 5(-2) + 6 = 4 - 10 + 6 = 0" },
        { eq: "\\lim_{x \\to 1} (3x^3 - 2x^2 + 5x - 4)", ans: "2", options: ["2", "4", "0", "-2"], sol: "3(1)^3 - 2(1)^2 + 5(1) - 4 = 3 - 2 + 5 - 4 = 2" },
        { eq: "\\lim_{x \\to -3} (2x^2 - x - 5)", ans: "16", options: ["16", "10", "20", "14"], sol: "2(-3)^2 - (-3) - 5 = 18 + 3 - 5 = 16" },
        { eq: "\\lim_{x \\to 4} (x^2 - 16)", ans: "0", options: ["0", "8", "-8", "16"], sol: "4^2 - 16 = 16 - 16 = 0" },
        { eq: "\\lim_{x \\to 2} (x^3 - 8)", ans: "0", options: ["0", "4", "8", "-8"], sol: "2^3 - 8 = 8 - 8 = 0" },
        { eq: "\\lim_{x \\to -1} (x^4 + 2x^2 - 3)", ans: "0", options: ["0", "2", "-2", "4"], sol: "(-1)^4 + 2(-1)^2 - 3 = 1 + 2 - 3 = 0" },
        { eq: "\\lim_{x \\to 0} (-2x^3 + 4x^2 - 6x + 1)", ans: "1", options: ["1", "0", "-6", "2"], sol: "-2(0)^3 + 4(0)^2 - 6(0) + 1 = 1" },
        { eq: "\\lim_{x \\to 5} (2x^2 - 10x + 5)", ans: "5", options: ["5", "0", "10", "25"], sol: "2(5)^2 - 10(5) + 5 = 50 - 50 + 5 = 5" },
        { eq: "\\lim_{x \\to -2} (3x^3 + 4x^2 - x + 2)", ans: "-4", options: ["-4", "0", "4", "-8"], sol: "3(-2)^3 + 4(-2)^2 - (-2) + 2 = -24 + 16 + 2 + 2 = -4" },
        { eq: "\\lim_{x \\to 1} (-x^2 + 7x - 2)", ans: "4", options: ["4", "6", "2", "8"], sol: "-(1)^2 + 7(1) - 2 = -1 + 7 - 2 = 4" },
        { eq: "\\lim_{x \\to 3} (2x^3 - 5x^2 + x - 1)", ans: "11", options: ["11", "9", "13", "7"], sol: "2(3)^3 - 5(3)^2 + 3 - 1 = 54 - 45 + 3 - 1 = 11" },
        { eq: "\\lim_{x \\to -4} (x^2 + 3x - 4)", ans: "0", options: ["0", "4", "-4", "8"], sol: "(-4)^2 + 3(-4) - 4 = 16 - 12 - 4 = 0" },
        { eq: "\\lim_{x \\to 2} (4x^2 - 6x + 2)", ans: "6", options: ["6", "4", "8", "2"], sol: "4(2)^2 - 6(2) + 2 = 16 - 12 + 2 = 6" },
        { eq: "\\lim_{x \\to -1} (-3x^3 + 2x^2 - x + 5)", ans: "11", options: ["11", "9", "13", "5"], sol: "-3(-1)^3 + 2(-1)^2 - (-1) + 5 = 3 + 2 + 1 + 5 = 11" },
        { eq: "\\lim_{x \\to 0} (x^6 - 3x^4 + 2x^2 - 8)", ans: "-8", options: ["-8", "0", "8", "2"], sol: "0^6 - 3(0)^4 + 2(0)^2 - 8 = -8" },
        { eq: "\\lim_{x \\to 1} (5x^4 - 4x^3 + 3x^2 - 2x + 1)", ans: "3", options: ["3", "1", "5", "7"], sol: "5(1)^4 - 4(1)^3 + 3(1)^2 - 2(1) + 1 = 5 - 4 + 3 - 2 + 1 = 3" },
        { eq: "\\lim_{x \\to -2} (x^4 - 2x^3 + x - 2)", ans: "28", options: ["28", "24", "32", "20"], sol: "(-2)^4 - 2(-2)^3 + (-2) - 2 = 16 - 2(-8) - 4 = 16 + 16 - 4 = 28" },
        { eq: "\\lim_{x \\to 3} (-x^2 + 9)", ans: "0", options: ["0", "9", "-9", "3"], sol: "-(3)^2 + 9 = -9 + 9 = 0" },
        { eq: "\\lim_{x \\to 2} (x^4 - 3x^2 + 4)", ans: "8", options: ["8", "4", "12", "0"], sol: "2^4 - 3(2)^2 + 4 = 16 - 12 + 4 = 8" },
        { eq: "\\lim_{x \\to -3} (x^3 + 27)", ans: "0", options: ["0", "27", "-27", "9"], sol: "(-3)^3 + 27 = -27 + 27 = 0" },
        { eq: "\\lim_{x \\to 4} (3x^2 - 10x - 8)", ans: "0", options: ["0", "8", "-8", "4"], sol: "3(4)^2 - 10(4) - 8 = 48 - 40 - 8 = 0" }
    ];

    let examQuestions = [];
    let startTime;
    let timerInterval;
    let studentName = "";

    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function startExam() {
        const nameInput = document.getElementById('student-name').value.trim();
        if(nameInput === "") {
            alert("សូមបញ្ចូលឈ្មោះរបស់អ្នកជាមុនសិន!");
            return;
        }
        studentName = nameInput;
        document.getElementById('display-name').innerText = studentName;
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('exam-screen').style.display = 'block';
        
        examQuestions = shuffle([...rawQuestions]).map(q => {
            return {
                ...q,
                shuffledOptions: shuffle([...q.options])
            };
        });
        
        renderQuestions();
        
        startTime = Date.now();
        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        const diff = Math.floor((Date.now() - startTime) / 1000);
        const m = Math.floor(diff / 60).toString().padStart(2, '0');
        const s = (diff % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        let html = '';
        
        examQuestions.forEach((q, index) => {
            html += `
                <div class="question-card" id="q-card-${index}">
                    <div class="question-text">លំហាត់ទី ${index + 1} ៖ ចូរគណនាលីមីតខាងក្រោម៖ <br><br> $$ ${q.eq} = ? $$</div>
                    <ul class="options-list">
            `;
            q.shuffledOptions.forEach((opt, optIndex) => {
                html += `
                    <li>
                        <label>
                            <input type="radio" name="q${index}" value="${opt}">
                            $ ${opt} $
                        </label>
                    </li>
                `;
            });
            html += `</ul></div>`;
        });
        
        container.innerHTML = html;
        MathJax.typesetPromise();
    }

    function submitExam() {
        if(!confirm("តើអ្នកពិតជាចង់បញ្ចប់ការប្រឡង និងមើលលទ្ធផលមែនទេ?")) return;
        
        clearInterval(timerInterval);
        
        let score = 0;
        let reviewHtml = '';
        
        examQuestions.forEach((q, index) => {
            const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
            const userAns = selectedOption ? selectedOption.value : null;
            
            let statusClass = 'unanswered-bg';
            let statusText = 'មិនបានឆ្លើយ ⚠️';
            let statusColor = '#fbbc04';
            
            if (userAns === q.ans) {
                score += 5;
                statusClass = 'correct-bg';
                statusText = 'ត្រឹមត្រូវ ✅';
                statusColor = '#34a853';
            } else if (userAns !== null) {
                statusClass = 'wrong-bg';
                statusText = 'មិនទាន់ត្រឹមត្រូវ ❌';
                statusColor = '#ea4335';
            }
            
            reviewHtml += `
                <div class="review-card ${statusClass}">
                    <strong>លំហាត់ទី ${index + 1} ៖</strong> $$ ${q.eq} $$
                    <div class="ans-row">
                        <span style="color: ${statusColor}; font-weight: bold;">${statusText}</span><br>
                        ជម្រើសរបស់អ្នក៖ <strong>$ ${userAns !== null ? userAns : '\\text{គ្មាន}'} $</strong> <br>
                        ចម្លើយត្រឹមត្រូវ៖ <strong>$ ${q.ans} $</strong>
                    </div>
                    <div class="solution-box">
                        <strong>សម្រាយបញ្ជាក់៖</strong><br>
                        $$ \\lim_{x \\to a} f(x) = f(a) \\implies ${q.eq} = ${q.sol} $$
                    </div>
                </div>
            `;
        });
        
        let grade = '';
        let msg = '';
        if (score >= 112.5) { grade = 'A (ល្អប្រសើរ)'; msg = 'អស្ចារ្យណាស់! អ្នកពិតជាមានមូលដ្ឋានគ្រឹះគណិតវិទ្យាល្អឥតខ្ចោះមែន! 🌟'; }
        else if (score >= 100) { grade = 'B (ល្អណាស់)'; msg = 'ធ្វើបានល្អណាស់! បន្តការខិតខំបន្ថែមទៀត! 👍'; }
        else if (score >= 87.5) { grade = 'C (ល្អ)'; msg = 'លទ្ធផលល្អ! សាកល្បងហ្វឹកហាត់បន្ថែមដើម្បីទទួលបានលទ្ធផលកាន់តែប្រសើរ! 💪'; }
        else if (score >= 75) { grade = 'D (បង្គួរ)'; msg = 'អ្នកយល់បានមួយកម្រិតហើយ ត្រូវការរំលឹកមេរៀនឡើងវិញបន្តិចទៀត! 📚'; }
        else if (score >= 62.5) { grade = 'E (មធ្យម)'; msg = 'លទ្ធផលមធ្យម! កុំទាន់អាក់អន់ចិត្ត ត្រូវខំប្រឹងរៀនសូត្រជាបន្តបន្ទាប់! 📖'; }
        else { grade = 'F (ធ្លាក់)'; msg = 'សូមកុំបោះបង់! ព្យាយាមមើលមេរៀនឡើងវិញ និងសួរគ្រូឬមិត្តភ័ក្តិបន្ថែមណា៎! 🤝'; }

        document.getElementById('exam-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('res-name').innerText = studentName;
        document.getElementById('res-time').innerText = document.getElementById('timer').innerText;
        document.getElementById('res-score').innerText = score;
        document.getElementById('res-grade').innerText = grade;
        document.getElementById('res-msg').innerText = msg;
        
        document.getElementById('review-container').innerHTML = reviewHtml;
        MathJax.typesetPromise();
        window.scrollTo(0, 0);
    }
</script>

</body>
</html>
